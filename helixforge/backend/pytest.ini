[pytest]
asyncio_default_fixture_loop_scope = function
markers =
    unit: fast, offline-safe unit tests (no network, no heavy tool)
    integration: multi-component tests using the in-process app
    live_api: hits real external APIs (PubMed/ChEMBL/ClinicalTrials); needs network
    slow: runs a full agentic pipeline; slower
    local_tool: requires a local scientific tool (RDKit/TDC)
    live_llm: hits a real LLM provider (Anthropic); needs ANTHROPIC_API_KEY + opt-in env
addopts = -ra
