# HelixForge — OPTIONAL remote-GPU control-plane example (Phase 8).
#
# This is an EXAMPLE only. It is NOT required to run HelixForge (CPU-only is a
# complete mode) and is not wired into the default `docker compose`. It illustrates
# how you would point the backend at an external, provider-neutral GPU control plane
# that implements the generic REST contract:
#   POST /v1/jobs · GET /v1/jobs/{id} · POST /v1/jobs/{id}/cancel · GET /v1/jobs/{id}/artifacts
#
# DO NOT commit real credentials. Provide them via a local .env that is gitignored.
# No CUDA / nvidia-container-runtime is required on the HelixForge host itself — the
# GPU runs remotely on the control plane. Live paid jobs remain gated behind
# HELIXFORGE_ENABLE_LIVE_GPU_TEST=true and require human approval per job.
#
# Usage (example):
#   docker compose -f docker-compose.yml -f docker-compose.remote-gpu.example.yml up
#
services:
  backend:
    environment:
      # --- External GPU gateway (all optional; disabled by default) ---
      HELIXFORGE_REMOTE_GPU_ENABLED: "false"          # set "true" only when ready
      HELIXFORGE_REMOTE_GPU_PROVIDER: "generic_rest"
      HELIXFORGE_REMOTE_GPU_ENDPOINT: "${HELIXFORGE_REMOTE_GPU_ENDPOINT:-}"     # e.g. https://gpu.example.internal
      HELIXFORGE_REMOTE_GPU_API_TOKEN: "${HELIXFORGE_REMOTE_GPU_API_TOKEN:-}"   # from gitignored .env; masked in UI
      HELIXFORGE_REMOTE_GPU_WEBHOOK_SECRET: "${HELIXFORGE_REMOTE_GPU_WEBHOOK_SECRET:-}"  # HMAC-SHA256 webhook verify
      HELIXFORGE_REMOTE_GPU_MAX_JOB_COST_USD: "10.00"
      HELIXFORGE_REMOTE_GPU_MAX_DAILY_COST_USD: "30.00"
      HELIXFORGE_REMOTE_GPU_MAX_RUNTIME_MINUTES: "240"
      HELIXFORGE_REMOTE_GPU_POLL_SECONDS: "10"
      HELIXFORGE_ENABLE_LIVE_GPU_TEST: "false"        # gates ANY live provider call

  # Illustrative placeholder for a GPU control plane you operate. HelixForge only
  # ever sends it an allowlisted, validated, human-approved job specification — never
  # arbitrary code, images, or shell. Run only the allowlisted worker images here.
  #
  # gpu-control-plane:
  #   image: your-registry.example/helixforge-gpu-control-plane@sha256:<digest>
  #   # ports / GPU runtime / secrets configured on YOUR infrastructure, not here.
