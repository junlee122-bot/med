name: HelixForge CI

on:
  push:
    branches: ["**"]
    paths: ["helixforge/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["helixforge/**", ".github/workflows/ci.yml"]

jobs:
  backend:
    name: Backend (import + offline tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helixforge/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps (no heavy scientific tools in CI)
        run: |
          python -m pip install --upgrade pip
          # Pinned fastapi/starlette pair (see requirements.txt); avoid the
          # heavy/slow RDKit + PyTDC wheels in CI — those are covered locally.
          pip install "fastapi==0.115.6" "starlette>=0.40,<0.42" "uvicorn[standard]==0.32.1" \
                      "httpx>=0.27,<1.0" "pydantic>=2.7,<3.0" "pydantic-settings>=2.3,<3.0" \
                      "python-multipart>=0.0.9" "pytest>=8.0"
      - name: App imports and routes register
        run: |
          python -c "import app.main as m; n=len([r for r in m.app.routes if getattr(r,'path','').startswith('/api')]); print('api routes:', n); assert n >= 80"
      - name: Offline-safe tests (unit + integration; skips live_api/slow/local_tool)
        run: pytest app/tests -q -m "unit or integration"

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helixforge/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

# NOTE: RDKit / PyTDC / live-API and slow agentic tests are validated locally
# (see docs/RUNBOOK.md). CI intentionally skips them for stability; if a runner
# can install them, run `pytest -m "not live_api and not slow"` for more coverage.
